! Reference configuration - Project 2, SW1 (Cisco 3650, IOS-XE 16.x)
! Normalized for this portfolio. Not re-tested. Verify against current Cisco docs.
! SW2 and SW3 follow the same pattern with their own port numbers and
! management addresses (10.0.2.98 and 10.0.2.97).
!
hostname SW1
!
vlan 2
 name VLAN2
vlan 3
 name VLAN3
!
! ---- Uplink trunk toward SW2 ----
interface GigabitEthernet1/0/1
 description Trunk to SW2
 switchport mode trunk
 switchport trunk allowed vlan 1-3
!
! ---- One PC per VLAN ----
interface GigabitEthernet1/0/2
 description PC - VLAN 1
 switchport mode access
 switchport access vlan 1
!
interface GigabitEthernet1/0/3
 description PC - VLAN 2
 switchport mode access
 switchport access vlan 2
!
interface GigabitEthernet1/0/4
 description PC - VLAN 3
 switchport mode access
 switchport access vlan 3
!
! ---- Management interface ----
interface Vlan2
 description Management
 ip address 10.0.2.99 255.255.255.0
 no shutdown
!
ip default-gateway 10.0.2.1
!
! ---- Secure management ----
ip domain-name lab.example
username admin privilege 15 secret <ADMIN_PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 15
 login local
 transport input ssh
!
end
! copy running-config startup-config
