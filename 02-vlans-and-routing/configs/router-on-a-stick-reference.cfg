! Reference configuration - Project 2, R1 (Cisco 2911, IOS 15.x)
! Normalized for this portfolio. Not re-tested. Verify against current Cisco docs.
!
hostname R1
!
! ---- Secure management ----
ip domain-name lab.example
username admin privilege 15 secret <ADMIN_PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
!
line vty 0 15
 login local
 transport input ssh
!
! ---- Router-on-a-stick: one trunk, one subinterface per VLAN ----
interface GigabitEthernet0/0
 description Trunk to SW2
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.1
 description VLAN 1 gateway (native)
 encapsulation dot1Q 1 native
 ip address 10.0.1.1 255.255.255.0
!
interface GigabitEthernet0/0.2
 description VLAN 2 gateway
 encapsulation dot1Q 2
 ip address 10.0.2.1 255.255.255.0
!
interface GigabitEthernet0/0.3
 description VLAN 3 gateway
 encapsulation dot1Q 3
 ip address 10.0.3.1 255.255.255.0
!
! ---- DHCP: hand out .100-.200, reserve the rest ----
ip dhcp excluded-address 10.0.1.1 10.0.1.99
ip dhcp excluded-address 10.0.1.201 10.0.1.254
ip dhcp excluded-address 10.0.2.1 10.0.2.99
ip dhcp excluded-address 10.0.2.201 10.0.2.254
ip dhcp excluded-address 10.0.3.1 10.0.3.99
ip dhcp excluded-address 10.0.3.201 10.0.3.254
!
ip dhcp pool VLAN1
 network 10.0.1.0 255.255.255.0
 default-router 10.0.1.1
 dns-server 8.8.8.8
!
ip dhcp pool VLAN2
 network 10.0.2.0 255.255.255.0
 default-router 10.0.2.1
 dns-server 8.8.8.8
!
ip dhcp pool VLAN3
 network 10.0.3.0 255.255.255.0
 default-router 10.0.3.1
 dns-server 8.8.8.8
!
end
! copy running-config startup-config
