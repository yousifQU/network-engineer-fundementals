! Reference configuration - Project 4, SW1 (Cisco 3750)
! Normalized for this portfolio. Not re-tested. Verify against current Cisco docs.
!
! MSTP plan (same region name and revision on every switch, including the HP/Aruba):
!   Instance 1 = VLAN 10      -> root SW2 (traffic toward R2)
!   Instance 2 = VLANs 20, 30 -> root SW1 (traffic toward R1)
! On SW2 the priorities are swapped (instance 1 = 4096, instance 2 = 8192).
!
hostname SW1
!
vlan 10
 name VLAN10
vlan 20
 name VLAN20
vlan 30
 name VLAN30
!
! ---- Multiple Spanning Tree ----
spanning-tree mode mst
spanning-tree mst configuration
 name LAB-REGION
 revision 1
 instance 1 vlan 10
 instance 2 vlan 20,30
 exit
spanning-tree mst 2 priority 4096
spanning-tree mst 1 priority 8192
!
! ---- Used ports: always describe them ----
interface GigabitEthernet1/0/1
 description Trunk to R1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
!
interface GigabitEthernet1/0/2
 description Trunk to SW2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
!
interface GigabitEthernet1/0/3
 description Trunk to SW3
 ! If rejected, the port is in routed mode: enter "switchport" first.
 switchport
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
!
interface GigabitEthernet1/0/4
 description PC1 - VLAN 20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
!
! ---- Unused ports: shut them down ----
interface range GigabitEthernet1/0/5 - 24
 description UNUSED - shutdown
 shutdown
!
! ---- Management ----
interface Vlan20
 description Management
 ip address 10.2.1.3 255.255.255.0
 no shutdown
!
ip default-gateway 10.2.1.1
!
ip domain-name lab.example
username admin privilege 15 secret <ADMIN_PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 15
 login local
 transport input ssh
!
end
! copy running-config startup-config
! Verify: show spanning-tree mst | show spanning-tree mst configuration
