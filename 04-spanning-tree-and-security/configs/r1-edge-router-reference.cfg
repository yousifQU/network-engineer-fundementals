! Reference configuration - Project 4, R1 (Cisco ISR 4331, IOS-XE)
! Normalized for this portfolio. Not re-tested. Verify against current Cisco docs.
!
hostname R1
!
! ---- Uplink (outside) ----
interface GigabitEthernet0/0/2
 description Uplink to campus / internet
 ip address 203.0.113.254 255.255.255.0
 ip nat outside
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! ---- LAN trunk (inside), one subinterface per VLAN ----
interface GigabitEthernet0/0/1
 description Trunk to SW1
 no ip address
 no shutdown
!
interface GigabitEthernet0/0/1.10
 description VLAN 10 subinterface
 encapsulation dot1Q 10
 ip address 10.1.1.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0/1.20
 description VLAN 20 subinterface
 encapsulation dot1Q 20
 ip address 10.2.1.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0/1.30
 description VLAN 30 subinterface
 encapsulation dot1Q 30
 ip address 10.3.1.1 255.255.255.0
 ip nat inside
!
! ---- DHCP (repeat for VLANs 10 and 30) ----
ip dhcp excluded-address 10.2.1.1 10.2.1.99
ip dhcp excluded-address 10.2.1.201 10.2.1.254
ip dhcp pool VLAN20
 network 10.2.1.0 255.255.255.0
 default-router 10.2.1.1
 dns-server <DNS_SERVER>
!
! ---- NAT overload (PAT): internal VLANs share the uplink address ----
access-list 10 permit 10.1.1.0 0.0.0.255
access-list 10 permit 10.2.1.0 0.0.0.255
access-list 10 permit 10.3.1.0 0.0.0.255
ip nat inside source list 10 interface GigabitEthernet0/0/2 overload
!
! ---- Secure management ----
ip domain-name lab.example
username admin privilege 15 secret <ADMIN_PASSWORD>
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 15
 login local
 transport input ssh
!
end
! copy running-config startup-config
! Verify: show ip nat translations | show ip dhcp binding
