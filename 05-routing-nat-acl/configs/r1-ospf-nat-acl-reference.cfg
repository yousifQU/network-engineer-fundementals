! Reference configuration - Project 5, R1 (Cisco ISR 4331, IOS-XE)
! Normalized for this portfolio. Not re-tested. Verify against current Cisco docs.
! VLAN subinterfaces, DHCP, and SSH are as in Project 4.
!
hostname R1
!
! ---- Transit link to R2 (inside) ----
interface GigabitEthernet0/0/0
 description Transit to R2
 ip address 192.168.0.1 255.255.255.252
 ip nat inside
 no shutdown
!
! ---- VLAN 40 subinterface toward the VyOS access point (inside) ----
interface GigabitEthernet0/0/1.40
 description VLAN 40 to VyOS
 encapsulation dot1Q 40
 ip address 172.30.0.1 255.255.255.128
 ip nat inside
!
! ---- Uplink (outside) ----
interface GigabitEthernet0/0/2
 description Uplink to campus / internet
 ip address 203.0.113.254 255.255.255.0
 ip nat outside
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! ---- OSPF ----
router ospf 1
 router-id 1.1.1.1
 network 192.168.0.0 0.0.0.3 area 0
 network 172.30.0.0 0.0.0.127 area 0
 network 10.1.1.0 0.0.0.255 area 0
 network 10.2.1.0 0.0.0.255 area 0
 network 10.3.1.0 0.0.0.255 area 0
 default-information originate
!
interface GigabitEthernet0/0/2
 ip ospf 1 area 0
!
! ---- NAT overload, limited to approved networks ----
! R1 VLANs, the transit link, and the VyOS networks may reach the internet.
! R2's VLAN subnets (10.x.2.0/24) are not listed, so they are not translated.
ip access-list standard NAT-ALLOWED
 permit 10.1.1.0 0.0.0.255
 permit 10.2.1.0 0.0.0.255
 permit 10.3.1.0 0.0.0.255
 permit 192.168.0.0 0.0.255.255
 permit 172.30.0.0 0.0.255.255
!
ip nat inside source list NAT-ALLOWED interface GigabitEthernet0/0/2 overload
!
end
! copy running-config startup-config
! Verify: show ip ospf neighbor | show ip route ospf | show ip nat translations
