! Reference configuration - Project 5, R2 (Cisco 1921, IOS 15.x)
! Normalized for this portfolio. Verify against current Cisco docs.
!
hostname R2
!
! ---- Transit link to R1 ----
interface GigabitEthernet0/1
 description Transit to R1
 ip address 192.168.0.2 255.255.255.252
 ip ospf 1 area 0
 no shutdown
!
! ---- LAN trunk, R2's own subnets ----
interface GigabitEthernet0/0
 description Trunk to SW3
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN 10 subinterface
 encapsulation dot1Q 10
 ip address 10.1.2.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description VLAN 20 subinterface
 encapsulation dot1Q 20
 ip address 10.2.2.1 255.255.255.0
!
interface GigabitEthernet0/0.30
 description VLAN 30 subinterface
 encapsulation dot1Q 30
 ip address 10.3.2.1 255.255.255.0
!
! ---- DHCP (repeat for VLANs 10 and 30) ----
ip dhcp excluded-address 10.2.2.1 10.2.2.99
ip dhcp excluded-address 10.2.2.201 10.2.2.254
ip dhcp pool VLAN20
 network 10.2.2.0 255.255.255.0
 default-router 10.2.2.1
 dns-server <DNS_SERVER>
!
! ---- OSPF ----
router ospf 1
 router-id 2.2.2.2
 network 192.168.0.0 0.0.0.3 area 0
 network 10.1.2.0 0.0.0.255 area 0
 network 10.2.2.0 0.0.0.255 area 0
 network 10.3.2.0 0.0.0.255 area 0
!
! ---- TFTP only from the wireless network ----
! Destination port goes AFTER the destination ("any eq tftp").
ip access-list extended TFTP-WIRELESS-ONLY
 permit udp 172.30.0.128 0.0.0.127 any eq tftp
 deny   udp any any eq tftp
 permit ip any any
!
! Applied where traffic toward the TFTP server enters R2.
interface GigabitEthernet0/1
 ip access-group TFTP-WIRELESS-ONLY in
!
end
! copy running-config startup-config
! Verify: show access-lists | show ip ospf neighbor
