# Reference configuration - Project 5, VyOS wireless access point (fanless mini PC)
# Normalized for this portfolio using VyOS 1.4-style syntax.
# Verify against the documentation for your VyOS version.
#
# Initial access: serial console at 115200 baud (PuTTY), default login, then:
#   configure
#   load /opt/vyatta/etc/config.boot.default    # start from a clean config
#   commit ; save

# ---- Wired link to R1 over VLAN 40 ----
set interfaces ethernet eth0 address '172.30.0.2/25'
set interfaces ethernet eth0 description 'VLAN 40 to SW1 / R1'

# ---- Wireless access point ----
set interfaces wireless wlan0 type 'access-point'
set interfaces wireless wlan0 address '172.30.0.129/25'
set interfaces wireless wlan0 description 'Wireless network'
set interfaces wireless wlan0 ssid '<SSID>'
set interfaces wireless wlan0 mode 'g'
set interfaces wireless wlan0 channel '6'
set interfaces wireless wlan0 country-code 'us'
set interfaces wireless wlan0 security wpa mode 'wpa2'
set interfaces wireless wlan0 security wpa cipher 'CCMP'
set interfaces wireless wlan0 security wpa passphrase '<WIFI_PASSPHRASE>'

# ---- DHCP for wireless clients ----
set service dhcp-server shared-network-name WLAN0-AP subnet 172.30.0.128/25 subnet-id '1'
set service dhcp-server shared-network-name WLAN0-AP subnet 172.30.0.128/25 option default-router '172.30.0.129'
set service dhcp-server shared-network-name WLAN0-AP subnet 172.30.0.128/25 option name-server '<DNS_SERVER>'
set service dhcp-server shared-network-name WLAN0-AP subnet 172.30.0.128/25 lease '86400'
set service dhcp-server shared-network-name WLAN0-AP subnet 172.30.0.128/25 range 0 start '172.30.0.130'
set service dhcp-server shared-network-name WLAN0-AP subnet 172.30.0.128/25 range 0 stop '172.30.0.254'

# ---- OSPF: advertise both networks, learn the default route from R1 ----
set protocols ospf parameters router-id '3.3.3.3'
set protocols ospf area 0 network '172.30.0.0/25'
set protocols ospf area 0 network '172.30.0.128/25'
set protocols ospf interface eth0
set protocols ospf interface wlan0 passive

# ---- SSH management on the wired side only ----
set service ssh listen-address '172.30.0.2'
set service ssh port '22'

commit
save
# Verify: show interfaces wireless | show dhcp server leases | show ip ospf neighbor
